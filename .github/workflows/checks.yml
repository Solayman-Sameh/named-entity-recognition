name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Offline checks (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      NER_MODEL_DIR: ''
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install lightweight validation dependency
        run: python -m pip install -r requirements-ci.txt
      - name: Check source, notebooks, documentation and Git contents
        run: python scripts/check_repository.py
      - name: Run model-free regression tests
        run: python -m unittest discover -s tests -v

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Publish release after checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -f "docs/releases/${RELEASE_TAG}.md"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; leaving it unchanged."
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "docs/releases/${RELEASE_TAG}.md"
          fi
